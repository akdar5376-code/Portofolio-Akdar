<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Ilustrasi artikel blog">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="50%" stop-color="#111c33"/>
            <stop offset="100%" stop-color="#082f49"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#22d3ee"/>
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="1200" height="675" fill="url(#bg)"/>
    <rect width="1200" height="675" fill="url(#grid)"/>
    <circle cx="980" cy="120" r="220" fill="#3b82f6" fill-opacity="0.12"/>
    <circle cx="220" cy="560" r="260" fill="#22d3ee" fill-opacity="0.10"/>
    <g transform="translate(600 337)" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">
        <rect x="-110" y="-90" width="220" height="180" rx="28" fill="#0f172a" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="2"/>
        <path d="M-58 -34 H58" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
        <path d="M-58 0 H30" fill="none" stroke="#e2e8f0" stroke-opacity="0.75" stroke-width="8" stroke-linecap="round"/>
        <path d="M-58 34 H-6" fill="none" stroke="#e2e8f0" stroke-opacity="0.45" stroke-width="8" stroke-linecap="round"/>
        <text x="0" y="150" fill="#e2e8f0" fill-opacity="0.75" font-size="26" letter-spacing="6">BLOG &amp; NOTES</text>
    </g>
</svg>
